---
- name: Tải script cài k3s
  ansible.builtin.get_url:
    url: https://get.k3s.io
    dest: /usr/local/bin/k3s-install.sh
    mode: "0755"

- name: Cài k3s agent và join vào server (bỏ qua nếu đã có)
  ansible.builtin.command: /usr/local/bin/k3s-install.sh
  args:
    creates: /usr/local/bin/k3s
  environment:
    INSTALL_K3S_VERSION: "{{ k3s_version }}"
    K3S_URL: "https://{{ hostvars[groups['k3s_server'][0]].node_ip }}:6443"
    K3S_TOKEN: "{{ vault_k3s_token }}"
    INSTALL_K3S_EXEC: "agent --node-ip={{ node_ip }} --flannel-iface={{ private_iface }}"
