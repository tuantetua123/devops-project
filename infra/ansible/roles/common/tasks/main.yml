---
- name: Cài gói cơ bản
  ansible.builtin.apt:
    name: "{{ base_packages }}"
    state: present
    update_cache: true
    cache_valid_time: 3600

- name: Đặt múi giờ
  community.general.timezone:
    name: "{{ timezone }}"

- name: Tạo user deploy (sudo, đăng nhập bằng key)
  ansible.builtin.user:
    name: "{{ deploy_user }}"
    shell: /bin/bash
    groups: sudo
    append: true

- name: Cài SSH key cho user deploy
  ansible.posix.authorized_key:
    user: "{{ deploy_user }}"
    key: "{{ deploy_ssh_public_key }}"
  when: deploy_ssh_public_key | length > 0

- name: Cho deploy dùng sudo không cần mật khẩu
  ansible.builtin.copy:
    content: "{{ deploy_user }} ALL=(ALL) NOPASSWD:ALL\n"
    dest: "/etc/sudoers.d/90-{{ deploy_user }}"
    mode: "0440"
    validate: visudo -cf %s

# Đặt tên 00- để được đọc TRƯỚC 50-cloud-init.conf (SSH lấy giá trị đầu tiên)
- name: Cứng hóa SSH (tắt root, tắt mật khẩu)
  ansible.builtin.copy:
    dest: /etc/ssh/sshd_config.d/00-hardening.conf
    mode: "0644"
    content: |
      PermitRootLogin no
      PasswordAuthentication no
      PubkeyAuthentication yes
  notify: Reload ssh

- name: Mở các cổng cần thiết trên ufw (luật từ Terraform)
  community.general.ufw:
    rule: allow
    port: "{{ item.port if item.port != 'any' else omit }}"
    proto: "{{ item.proto }}"
    src: "{{ item.source }}"
    comment: "{{ item.comment }}"
  loop: "{{ firewall_rules }}"

- name: Bật ufw, chặn mọi kết nối vào còn lại
  community.general.ufw:
    state: enabled
    policy: deny
    direction: incoming

- name: Cho phép kết nối ra ngoài
  community.general.ufw:
    policy: allow
    direction: outgoing
