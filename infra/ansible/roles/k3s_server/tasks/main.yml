---
- name: Tải script cài k3s
  ansible.builtin.get_url:
    url: https://get.k3s.io
    dest: /usr/local/bin/k3s-install.sh
    mode: "0755"

- name: Cài k3s server (bỏ qua nếu đã có)
  ansible.builtin.command: /usr/local/bin/k3s-install.sh
  args:
    creates: /usr/local/bin/k3s
  environment:
    INSTALL_K3S_VERSION: "{{ k3s_version }}"
    K3S_TOKEN: "{{ vault_k3s_token }}"
    INSTALL_K3S_EXEC: >-
      server --node-ip={{ node_ip }} --advertise-address={{ node_ip }}
      --tls-san={{ node_ip }} --flannel-iface={{ private_iface }}
      --write-kubeconfig-mode=644

- name: Chờ server sẵn sàng
  ansible.builtin.command: k3s kubectl get nodes --no-headers
  register: k3s_nodes
  until: k3s_nodes.rc == 0 and (' Ready ' in k3s_nodes.stdout)
  retries: 30
  delay: 10
  changed_when: false

- name: Lấy kubeconfig về máy control
  ansible.builtin.fetch:
    src: /etc/rancher/k3s/k3s.yaml
    dest: "{{ playbook_dir }}/fetched/k3s.yaml"
    flat: true

- name: Sửa địa chỉ API trong kubeconfig thành IP server
  ansible.builtin.replace:
    path: "{{ playbook_dir }}/fetched/k3s.yaml"
    regexp: 'server: https://[^:]+:6443'
    replace: "server: https://{{ node_ip }}:6443"
  delegate_to: localhost
  become: false
