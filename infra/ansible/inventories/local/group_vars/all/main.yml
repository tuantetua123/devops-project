private_iface: enp0s8            # card host-only của VirtualBox (Ubuntu 22.04)
dl_arch: "{{ 'arm64' if ansible_architecture == 'aarch64' else 'amd64' }}"
timezone: Asia/Ho_Chi_Minh

deploy_user: deploy
deploy_ssh_public_key: "{{ lookup('ansible.builtin.file', '~/.ssh/id_ed25519.pub') }}"

k3s_version: v1.31.4+k3s1
kubectl_version: v1.31.4
node_exporter_version: 1.8.2
docker_users: [vagrant, deploy]
