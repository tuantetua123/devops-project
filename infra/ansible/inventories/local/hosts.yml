# Môi trường local (VirtualBox). Môi trường khác: tạo inventories/<tên>/ cùng cấu trúc.
all:
  vars:
    ansible_user: vagrant
    ansible_ssh_private_key_file: ~/.ssh/id_ed25519
    node_ip: "{{ ansible_host }}"
  children:
    ci:
      hosts:
        jenkins:
          ansible_host: 192.168.56.10
    k3s_server:
      hosts:
        k3s-1:
          ansible_host: 192.168.56.11
    k3s_agent:
      hosts:
        k3s-2:
          ansible_host: 192.168.56.12
    k3s:
      children:
        k3s_server:
        k3s_agent:
