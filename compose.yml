
name: attendance

# Shared security hardening
x-hardening: &hardening
  restart: unless-stopped
  security_opt:
    - no-new-privileges:true
  cap_drop: [ALL]

services:

  # PostgreSQL Database
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks: [appnet]

  # Database migrations
  migrate:
    image: postgres:16-alpine
    depends_on:
      db: { condition: service_healthy }
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
    volumes:
      - ./db/migrations:/migrations:ro
    entrypoint: ["sh", "-c"]
    command:
      - 'for f in /migrations/*.sql; do psql "$$DATABASE_URL" -v ON_ERROR_STOP=1 -f "$$f" || exit 1; done'
    restart: "no"
    networks: [appnet]

  # Seed sample data
  seed:
    image: postgres:16-alpine
    profiles: ["seed"]
    depends_on:
      migrate: { condition: service_completed_successfully }
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
    volumes:
      - ./db/seed:/seed:ro
    entrypoint:
      - sh
      - -c
      - 'psql "$$DATABASE_URL" -v ON_ERROR_STOP=1 -f /seed/seed.sql'
    networks: [appnet]

  # QR Service - Security Hardened
  qr:
    <<: *hardening

    read_only: true
    tmpfs:
      - /tmp:rw,nosuid,size=64m

    image: ${REGISTRY:-local}/attendance-qr:${TAG:-dev}
    build:
      context: ./qr
      args:
        GIT_SHA: ${GIT_SHA:-unknown}
        VERSION: ${TAG:-dev}
    environment:
      QR_SECRET: ${QR_SECRET:?set QR_SECRET in .env}
      QR_TTL_SECONDS: ${QR_TTL_SECONDS:-45}
      PUBLIC_BASE_URL: ${PUBLIC_BASE_URL:-http://localhost:${WEB_PORT:-8080}}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
    networks: [appnet]

  # FastAPI Backend - Security Hardened
  api:
    <<: *hardening

    read_only: true
    tmpfs:
      - /tmp:rw,nosuid,size=64m

    image: ${REGISTRY:-local}/attendance-api:${TAG:-dev}
    build:
      context: ./api
      args:
        GIT_SHA: ${GIT_SHA:-unknown}
        VERSION: ${TAG:-dev}
    depends_on:
      db: { condition: service_healthy }
      migrate: { condition: service_completed_successfully }
      qr: { condition: service_healthy }
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      ADMIN_API_KEY: ${ADMIN_API_KEY:?set ADMIN_API_KEY in .env}
      QR_SERVICE_URL: http://qr:8000
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
    networks: [appnet]

  # Nginx Frontend - Security Hardened
  web:
    <<: *hardening

    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=64m

    image: ${REGISTRY:-local}/attendance-web:${TAG:-dev}
    build:
      context: ./web
      args:
        GIT_SHA: ${GIT_SHA:-unknown}
        VERSION: ${TAG:-dev}
    depends_on:
      api: { condition: service_healthy }
    ports:
      - "${WEB_PORT:-8080}:8080"
    networks: [appnet]

networks:
  appnet:

volumes:
  pgdata:
