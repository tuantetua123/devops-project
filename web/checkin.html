
<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>QR Attendance - Sinh viên</title>
  <style>
    * { box-sizing:border-box }
    body {
      margin:0;
      min-height:100vh;
      background:#f3f7ff;
      font-family:Arial,sans-serif;
      color:#1e293b;
    }
    header {
      text-align:center;
      padding:24px;
      color:#2563eb;
      font-size:19px;
      font-weight:bold;
    }
    main {
      max-width:460px;
      margin:20px auto;
      padding:0 16px;
    }
    .card {
      background:#fff;
      border:1px solid #e2e8f0;
      border-radius:18px;
      overflow:hidden;
      box-shadow:0 12px 38px #1e3a8a10;
    }
    .hero {
      text-align:center;
      background:linear-gradient(125deg,#172554,#2563eb);
      color:#fff;
      padding:32px 23px;
    }
    .hero h1 {
      margin:5px 0 9px;
      font-size:26px;
    }
    .hero p {
      margin:0;
      font-size:14px;
      line-height:1.6;
      color:#dbeafe;
    }
    form { padding:27px }
    label {
      display:block;
      margin:0 0 8px;
      font-size:14px;
      font-weight:bold;
    }
    input {
      width:100%;
      padding:13px;
      border:1px solid #cbd5e1;
      border-radius:9px;
      font:inherit;
      margin-bottom:20px;
    }
    input:focus {
      outline:2px solid #bfdbfe;
      border-color:#2563eb;
    }
    button {
      width:100%;
      padding:14px;
      background:#2563eb;
      color:#fff;
      border:0;
      border-radius:9px;
      font-weight:bold;
      font-size:15px;
      cursor:pointer;
    }
    button:disabled {
      opacity:.65;
      cursor:not-allowed;
    }
    .note {
      text-align:center;
      color:#64748b;
      font-size:12px;
      line-height:1.7;
      margin:20px 0 0;
    }
    #message {
      display:none;
      padding:12px;
      margin-bottom:16px;
      border-radius:9px;
      font-size:14px;
      line-height:1.5;
    }
    #message.show { display:block }
    #message.success {
      background:#ecfdf5;
      color:#166534;
    }
    #message.error {
      background:#fff1f2;
      color:#be123c;
    }
    #message.info {
      background:#eff6ff;
      color:#1d4ed8;
    }
    footer {
      text-align:center;
      color:#94a3b8;
      font-size:12px;
      margin:24px;
    }
  </style>
</head>
<body>
  <header>▣ QR Attendance</header>

  <main>
    <section class="card">
      <div class="hero">
        <h1>Điểm danh buổi học</h1>
        <p>Nhập thông tin sinh viên để xác nhận có mặt.</p>
      </div>

      <form id="checkinForm">
        <div id="message" role="status"></div>

        <label for="studentId">
          Mã số sinh viên (MSSV)
        </label>
        <input
          id="studentId"
          maxlength="20"
          placeholder="Ví dụ: 24123456"
          autocomplete="off"
          required
        >

        <label for="studentName">Họ và tên</label>
        <input
          id="studentName"
          maxlength="100"
          placeholder="Nhập họ tên đầy đủ"
          autocomplete="name"
          required
        >

        <button id="submitBtn" type="submit">
          Xác nhận điểm danh
        </button>

        <p class="note">
          Mỗi MSSV chỉ được ghi nhận một lần trong một buổi học.
          Nếu QR hết hạn, hãy quét lại mã mới.
        </p>
      </form>
    </section>

    <footer>QR Attendance · Đồ án DevOps</footer>
  </main>

  <script>
    const $ = id => document.getElementById(id);

    const token = new URLSearchParams(
      location.search
    ).get('token');

    function message(text, type) {
      $('message').textContent = text;
      $('message').className = 'show ' + type;
    }

    if (!token) {
      message(
        'Bạn cần quét mã QR của giảng viên để mở trang này.',
        'error'
      );

      $('submitBtn').disabled = true;
    }

    $('checkinForm').onsubmit = async event => {
      event.preventDefault();

      if (!token) return;

      const student_id = $('studentId').value.trim();
      const student_name = $('studentName').value.trim();

      if (!student_id || !student_name) {
        return message(
          'Vui lòng nhập đủ MSSV và họ tên.',
          'error'
        );
      }

      const btn = $('submitBtn');
      btn.disabled = true;
      btn.textContent = 'Đang gửi...';

      try {
        const response = await fetch('/api/checkin', {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json'
          },
          body: JSON.stringify({
            token,
            student_id,
            student_name
          })
        });

        const data = await response.json()
          .catch(() => ({}));

        if (response.ok && data.status === 'ok') {
          message(
            'Điểm danh thành công! Thông tin của bạn đã được ghi nhận.',
            'success'
          );

          $('studentId').readOnly = true;
          $('studentName').readOnly = true;
          btn.textContent = 'Đã điểm danh';
          return;
        }

        if (
          response.ok &&
          data.status === 'already_checked_in'
        ) {
          message(
            'MSSV này đã điểm danh trong buổi học.',
            'info'
          );
          btn.textContent = 'Đã ghi nhận';
          return;
        }

        if (response.status === 400) {
          message(
            'Mã QR không hợp lệ hoặc hết hạn. Vui lòng quét lại.',
            'error'
          );
        } else if (response.status === 422) {
          message(
            'Thông tin chưa hợp lệ. Vui lòng kiểm tra lại.',
            'error'
          );
        } else {
          message(
            'Điểm danh không thành công. Hãy thử lại.',
            'error'
          );
        }

      } catch {
        message(
          'Không kết nối được máy chủ. Hãy kiểm tra mạng.',
          'error'
        );

      } finally {
        if (!btn.textContent.startsWith('Đã')) {
          btn.disabled = false;
          btn.textContent = 'Xác nhận điểm danh';
        }
      }
    };
  </script>
</body>
</html>
