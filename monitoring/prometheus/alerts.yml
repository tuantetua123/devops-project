groups:
  - name: attendance
    rules:
      - alert: ServiceDown
        expr: up{job=~"api|qr"} == 0
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "Service {{ $labels.job }} is DOWN"
      - alert: HighErrorRate
        expr: sum by (job) (rate(http_requests_total{status=~"5.."}[2m])) / sum by (job) (rate(http_requests_total[2m])) > 0.05
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: "Service {{ $labels.job }}: 5xx error rate above 5%"
      - alert: HighLatencyP95
        expr: histogram_quantile(0.95, sum by (le, job) (rate(http_request_duration_seconds_bucket[5m]))) > 1
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Service {{ $labels.job }}: p95 latency above 1s"
      - alert: HighCPU
        expr: rate(process_cpu_seconds_total{job=~"api|qr"}[2m]) > 0.8
        for: 2m
        labels:
          severity: warning
        annotations:
          summary: "Service {{ $labels.job }}: CPU above 80% of one core"