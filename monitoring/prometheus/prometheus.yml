global:
  scrape_interval: 5s
  evaluation_interval: 5s
rule_files:
  - /etc/prometheus/alerts.yml
alerting:
  alertmanagers:
    - static_configs:
        - targets: ['alertmanager:9093']
scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ['localhost:9090']
  - job_name: api
    metrics_path: /metrics
    static_configs:
      - targets: ['api:8000']
  - job_name: qr
    metrics_path: /metrics
    static_configs:
      - targets: ['qr:8000']