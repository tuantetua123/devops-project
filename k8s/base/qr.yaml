apiVersion: v1
kind: Service
metadata:
  name: qr
spec:
  selector:
    app: qr
  ports:
    - name: http
      port: 8000
      targetPort: http
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: qr
spec:
  replicas: 2
  revisionHistoryLimit: 5
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      app: qr
  template:
    metadata:
      labels:
        app: qr
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8000"
        prometheus.io/path: /metrics
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: qr
          image: ghcr.io/tuantetua123/attendance-qr:dev
          ports:
            - name: http
              containerPort: 8000
          env:
            - name: QR_SECRET
              valueFrom:
                secretKeyRef: { name: attendance-secrets, key: QR_SECRET }
            - name: QR_TTL_SECONDS
              valueFrom:
                configMapKeyRef: { name: attendance-config, key: QR_TTL_SECONDS }
            - name: PUBLIC_BASE_URL
              valueFrom:
                configMapKeyRef: { name: attendance-config, key: PUBLIC_BASE_URL }
            - name: LOG_LEVEL
              valueFrom:
                configMapKeyRef: { name: attendance-config, key: LOG_LEVEL }
          readinessProbe:
            httpGet: { path: /health, port: http }
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 3
          livenessProbe:
            httpGet: { path: /health, port: http }
            initialDelaySeconds: 15
            periodSeconds: 15
            timeoutSeconds: 3
          resources:
            requests: { cpu: 50m, memory: 96Mi }
            limits: { cpu: 300m, memory: 256Mi }
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ALL]