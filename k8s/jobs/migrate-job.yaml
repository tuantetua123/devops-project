# Run once per deploy (name is generated, Jobs are immutable):
#   kubectl -n staging create configmap db-migrations --from-file=db/migrations --dry-run=client -o yaml | kubectl -n staging apply -f -
#   kubectl -n staging create -f k8s/jobs/migrate-job.yaml
apiVersion: batch/v1
kind: Job
metadata:
  generateName: migrate-
spec:
  backoffLimit: 2
  ttlSecondsAfterFinished: 600
  template:
    spec:
      restartPolicy: Never
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 70
        runAsGroup: 70
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: migrate
          image: postgres:16-alpine
          env:
            - name: POSTGRES_USER
              valueFrom:
                configMapKeyRef: { name: attendance-config, key: POSTGRES_USER }
            - name: POSTGRES_DB
              valueFrom:
                configMapKeyRef: { name: attendance-config, key: POSTGRES_DB }
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef: { name: attendance-secrets, key: POSTGRES_PASSWORD }
            - name: DATABASE_URL
              value: postgresql://$(POSTGRES_USER):$(POSTGRES_PASSWORD)@db:5432/$(POSTGRES_DB)
          command: ["sh", "-c"]
          args:
            - |
              until pg_isready -h db -U "$POSTGRES_USER" -d "$POSTGRES_DB"; do sleep 2; done
              for f in /migrations/*.sql; do
                psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f "$f" || exit 1
              done
          resources:
            requests: { cpu: 25m, memory: 32Mi }
            limits: { cpu: 200m, memory: 128Mi }
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ALL]
          volumeMounts:
            - name: migrations
              mountPath: /migrations
              readOnly: true
      volumes:
        - name: migrations
          configMap:
            name: db-migrations