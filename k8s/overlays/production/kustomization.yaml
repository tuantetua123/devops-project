apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: production
resources:
  - ../../base
  - pdb.yaml
images:
  - name: ghcr.io/tuantetua123/attendance-api
    newTag: dev
  - name: ghcr.io/tuantetua123/attendance-qr
    newTag: dev
  - name: ghcr.io/tuantetua123/attendance-web
    newTag: dev
patches:
  - target:
      kind: ConfigMap
      name: attendance-config
    patch: |-
      - op: replace
        path: /data/PUBLIC_BASE_URL
        value: http://attendance.local