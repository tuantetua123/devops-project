apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: staging
resources:
  - ../../base
images:
  - name: ghcr.io/tuantetua123/attendance-api
    newTag: dev
  - name: ghcr.io/tuantetua123/attendance-qr
    newTag: dev
  - name: ghcr.io/tuantetua123/attendance-web
    newTag: dev
patches:
  - target:
      kind: Deployment
    patch: |-
      - op: replace
        path: /spec/replicas
        value: 1
  - target:
      kind: HorizontalPodAutoscaler
    patch: |-
      - op: replace
        path: /spec/minReplicas
        value: 1
      - op: replace
        path: /spec/maxReplicas
        value: 3
  - target:
      kind: Ingress
    patch: |-
      - op: replace
        path: /spec/rules/0/host
        value: staging.attendance.local
      - op: replace
        path: /spec/tls/0/hosts/0
        value: staging.attendance.local
      - op: replace
        path: /spec/tls/0/secretName
        value: staging-attendance-tls
  - target:
      kind: ConfigMap
      name: attendance-config
    patch: |-
      - op: replace
        path: /data/PUBLIC_BASE_URL
        value: https://staging.attendance.local